services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: virtual-lab-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtual-lab-backend
    ports:
      - "8000:8000"